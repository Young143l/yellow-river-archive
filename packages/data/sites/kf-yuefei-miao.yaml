figures:
  - name: 岳飞
    role: 南宋抗金名将，庙内主祀对象
    desc: 字鹏举。宋河北西路相州汤阴县人。南宋绍兴十年出师中原。收复郑州、洛阳等地。郾城之战大破金兵。后被诬陷下狱。
  - name: 施全
    role: 庙内施全祠所祀人物
    desc: 施全祠位于山门对面。祠内立其铜像。
  - name: 秦桧
    role: 铁跪像所列奸党之一
    desc: 秦桧与王氏、万俟卨、张俊、王俊一同铸为山门前铁跪像。

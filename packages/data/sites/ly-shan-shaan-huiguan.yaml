events:
  - year: 清康熙、雍正年间
    title: 秦晋富商建馆
    desc: 秦、晋两地商人共同捐资兴建此馆。
  - year: 清嘉庆年间
    title: 重葺会馆
    desc: 因风雨侵蚀，多处建筑出现坍塌。秦晋商人集资二万五千余两白银予以重修。
  - year: 1986年
    title: 列为省保
    desc: 1986年11月，成为河南省文物保护单位。
  - year: 2006年
    title: 列入国保
    desc: 2006年3月入选全国重点文物保护单位名单。同年5月25日，国务院正式公布为第六批全国重点文物保护单位。
  - year: 2019年
    title: 列入申遗点
    desc: 成为世界文化遗产‘万里茶道’申报项目的遗产点之一。

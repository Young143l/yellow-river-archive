summary: 齐云塔在洛阳白马寺山门东南约200米。现存塔建于金大定十五年（1175年）。它是十三级叠涩密檐式砖塔。通高26米。相传初建于东汉永平年间。
intro: 齐云塔又名释迦舍利塔、金方塔、白马寺塔。塔朝向正南。平面呈正方形。由基座、塔身、塔刹三部分组成。基座为束腰须弥座。每边长7.8米。束腰部分长宽均为6.76米。第一层檐下有普柏枋和一斗三升拱。各层檐用多层小砖砌成。檐下嵌菱角牙子装饰。塔身最粗位置在第四层与第五层檐之间。第六层开始，各层檐逐层向内收缩。塔顶设宝瓶式塔刹。整体轮廓接近抛物线。塔内有踏窝可供攀登。第十层南侧开一门。民间称其为‘南天门’。塔前立有3通碑记。分别是金大定十五年和明代重修所立。
archaeology: |-
  齐云塔未开展正式考古发掘。早期形制与始建时间依据文献推定。现存塔体为金大定十五年（1175年）重建。高26米。是洛阳地面遗存年代最早的古建筑。也是中原地区稀有的金代砖构实例。塔前3通碑记是判断沿革的关键实物证据。2009年，洛阳市启动维修保护工程。

  齐云塔又名释迦舍利塔、金方塔、白马寺塔。塔朝向正南。平面呈正方形。由基座、塔身、塔刹三部分组成。基座为束腰须弥座。每边长7.8米。束腰部分长宽均为6.76米。第一层檐下有普柏枋和一斗三升拱。各层檐用多层小砖砌成。檐下嵌菱角牙子装饰。塔身最粗位置在第四层与第五层檐之间。第六层开始，各层檐逐层向内收缩。塔顶设宝瓶式塔刹。整体轮廓接近抛物线。塔内有踏窝可供攀登。第十层南侧开一门。民间称其为‘南天门’。塔前立有3通碑记。分别是金大定十五年和明代重修所立。
events:
  - year: "69"
    title: 敕令创建
    desc: 汉明帝刘庄于永平十二年下令建塔。地点为释迦牟尼佛骨舍利所在的圣冢。
  - year: "1175"
    title: 金代重建
    desc: 临济宗僧人栖岩彦公主持重建砖塔。即今存齐云塔。
  - year: "1961"
    title: 列入国保
    desc: 国务院公布白马寺及齐云塔为全国重点文物保护单位。
  - year: "1990"
    title: 辟为尼众道场
    desc: 齐云塔院成为河南省首座比丘尼道场。
  - year: "2009"
    title: 维修保护
    desc: 洛阳市对齐云塔实施维修保护工程。

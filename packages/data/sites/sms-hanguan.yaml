artifacts:
  - id: sms-hanguan-artifact-1
    name: 战国箭镞
    desc: 出土自函谷关战国井式箭库。箭为铁杆铜簇，每三十枚捆扎为一束。锈蚀严重，无法分离。为研究战国兵器提供实物依据。
  - id: sms-hanguan-artifact-2
    name: 封泥
    desc: 出土于箭库东南一百余米处的土崖堆积层。属秦汉时期文书封缄遗存。对研究弘农郡官制及秦汉篆刻具有史料价值。
  - id: sms-hanguan-artifact-3
    name: 战国及汉代板瓦、筒瓦
    desc: 出土于古关楼基址附近地层。战国瓦片数量多、形制多样，非同一窑口烧造。说明关楼在使用期间多次修缮。
figures:
  - name: 尹喜
    role: 函谷关令
    desc: 尹喜任函谷关令时观天象，见紫气东来，预知贤人将至。他迎候老子，并恳请著书。老子遂写《道德经》。
  - name: 老子
    role: 思想家
    desc: 老子西行至函谷关。他应尹喜之请，在此撰写《道德经》五千言。函谷关因此成为该经典诞生地。

    - 信众可在初一、十五、中秋、春节等传统节日参拜祈福。
artifacts:
  - id: ly-baima-si-artifact-1
    name: 元代十八罗汉夹纻像
    desc: 使用夹纻干漆工艺制成。是国内现存唯一的夹纻干漆组像。属于国家一级文物。
  - id: ly-baima-si-artifact-2
    name: 释迦牟尼佛舍利
    desc: 现存三颗。分别来自阿育王安放、泰国赠送、斯里兰卡赠送。
  - id: ly-baima-si-artifact-3
    name: 中华古佛
    desc: 铜质鎏金造像。结跏趺坐于须弥座上。始塑于东汉洛阳白马寺。1995年泰国复制一尊归宗。
  - id: ly-baima-si-artifact-4
    name: 玉石弥勒菩萨坐像
    desc: 高2.16米。北魏时期作品。已流散海外。
    museum: 美国一家博物馆
  - id: ly-baima-si-artifact-5
    name: 白玉佛
    desc: 高约0.90米。民国时期移奉至毗卢阁内。
  - id: ly-baima-si-artifact-6
    name: 贝叶经
    desc: 相传由摄摩腾、竺法兰携入。共三十余片。文革期间焚毁。
figures:
  - name: 摄摩腾
    role: 天竺高僧
    desc: 应汉使邀请东来。与竺法兰同以白马驮经至洛阳。在白马寺译出《四十二章经》。
  - name: 竺法兰
    role: 天竺高僧
    desc: 与摄摩腾一同抵达洛阳。参与白马寺译经。其墓与摄摩腾墓东西并列，合称‘二僧墓’。
  - name: 汉明帝刘庄
    role: 东汉皇帝
    desc: 遣使求法。敕建白马寺。下令修建齐云塔。
  - name: 安世高
    role: 安息国王太子
    desc: 汉桓帝时到达白马寺。译佛经九十五部一百五十卷。开启佛经汉译先河。
  - name: 昙柯迦罗
    role: 印度高僧
    desc: 曹魏嘉平二年（250年）在白马寺译出《僧祗戒心》。为中国首部汉文佛教戒律。
  - name: 朱士行
    role: 汉地第一位受比丘戒者
    desc: 曹魏甘露五年（260年）依《羯磨法》登坛受戒。为中国汉地首位正式比丘。

    desc: 发现以彩陶为特征的新石器时代文化，命名"仰韶文化"，被视为中国现代考古学的开端。
  - year: '1961'
    title: 列为第一批全国重点文物保护单位
    desc: 遗址由国务院公布为第一批全国重点文物保护单位。
  - year: '2021'
    title: 仰韶村国家考古遗址公园开放
    desc: 在遗址原址建设考古遗址公园与仰韶文化博物馆，实现原址保护与公众展示。


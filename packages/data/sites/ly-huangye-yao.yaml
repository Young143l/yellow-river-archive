summary: 新安窑址位于丁蜀镇蜀山村新安村东南面。堆积范围长60米，宽40米。主要产品是陶罐和紫砂茶壶等日用器。停烧时间为20世纪70年代。
intro: |-
  新安窑址呈南北走向。窑床宽度为1.6米。两侧保留窑墙，高度0.8米。所用窑砖规格为5×8×22厘米。窑址北面紧邻小河。该河道目前仍可通航。窑址东南方向为农田。西北方向为村庄。窑尾已有20米损毁。现存窑床不足原长十分之一。堆积残存面积约500平方米。地表覆盖杂草与树木。

  新安窑址位于丁蜀镇蜀山村新安村东南面。堆积范围长60米，宽40米。主要产品是陶罐和紫砂茶壶等日用器。停烧时间为20世纪70年代。
archaeology: |-
  窑址堆积长60米，宽40米。窑床宽1.6米。窑墙残高0.8米。窑砖尺寸为5×8×22厘米。窑尾20米已毁。现存窑床仅余约十分之一。堆积占地500多平方米。烧造器物包括陶罐和紫砂茶壶。停烧时间是20世纪70年代。创烧年代尚未确认。

  新安窑址呈南北走向。窑床宽度为1.6米。两侧保留窑墙，高度0.8米。所用窑砖规格为5×8×22厘米。窑址北面紧邻小河。该河道目前仍可通航。窑址东南方向为农田。西北方向为村庄。窑尾已有20米损毁。现存窑床不足原长十分之一。堆积残存面积约500平方米。地表覆盖杂草与树木。

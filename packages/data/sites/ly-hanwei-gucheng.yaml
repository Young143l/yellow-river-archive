artifacts:
  - id: ly-hanwei-gucheng-artifact-1
    name: 熹平石经残石
    desc: 东汉蔡邕等人奉诏以隶书刻写的官定儒学经本。出土于太学遗址。存东汉熹平石经8000余字。
  - id: ly-hanwei-gucheng-artifact-2
    name: 正始石经残石
    desc: 三国魏正始二年刻立。每字用古文、小篆、汉隶三体书写。出土于太学遗址。存约2500字。
  - id: ly-hanwei-gucheng-artifact-3
    name: 辟雍碑
    desc: 西晋巨碑。1931年发现于辟雍遗址。通高3.22米。在中国文化教育史与书法艺术史上地位重要。
  - id: ly-hanwei-gucheng-artifact-4
    name: 北魏泥塑佛面造像
    desc: 永宁寺塔基出土的泥塑佛像残件。制作精细。表情从容慈祥。被誉为‘东方的蒙娜丽莎’。
figures:
  - name: 周成王
    role: 西周君主
    desc: 在周公主持下完成‘成王迁洛’。定都洛邑。
  - name: 刘秀
    role: 东汉光武帝
    desc: 公元25年定都洛阳。改洛阳为雒阳。营建高庙、社稷、太学等设施。
  - name: 曹丕
    role: 魏文帝
    desc: 220年定都洛阳。修复北宫。起太极殿。实行‘居中建极’的单一宫城制。
  - name: 孝文帝
    role: 北魏皇帝
    desc: 太和十九年迁都洛阳。启动北魏洛阳城大规模营建。
  - name: 灵太后胡氏
    role: 北魏临朝称制者
    desc: 熙平元年发起创建永宁寺。建造九层永宁寺塔。

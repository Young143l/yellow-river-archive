events:
  - year: 555年
    title: 始建建国寺
    desc: 北齐天保六年创建寺院。原名建国寺。
  - year: 712年
    title: 赐名大相国寺
    desc: 唐睿宗诏改建国寺为大相国寺。并出内帑扩建。
  - year: 995年
    title: 北宋大规模扩建
    desc: 至道元年起扩建。咸平四年完工。宋神宗时占地达540亩。
  - year: 1766年
    title: 乾隆重修
    desc: 乾隆三十一年至三十三年动用国帑重修。现存主要建筑多为此期所遗。
  - year: 2013年
    title: 列入全国重点文物保护单位
    desc: 被列为第七批全国重点文物保护单位。

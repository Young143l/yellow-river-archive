artifacts:
  - id: kf-daxiangguo-si-artifact-1
    name: 四面千手千眼观音像
    desc: 雕成于乾隆年间。高5.25米。重约2000公斤。四面站立。共1048只手和1048只眼。为大相国寺镇寺之宝。
  - id: kf-daxiangguo-si-artifact-2
    name: 清乾隆铜钟
    desc: 铸于乾隆三十三年（1768年）。高2.23米。口径1.81米。重达万斤。铸有十六字铭。是“相国霜钟”之源。
  - id: kf-daxiangguo-si-artifact-3
    name: 释迦牟尼铜像
    desc: 大雄宝殿内供奉。高4.3米。重400公斤。
  - id: kf-daxiangguo-si-artifact-4
    name: 释迦牟尼白玉像
    desc: 藏经楼下佛龛供奉。白玉产自缅甸。由缅甸工匠雕塑。为新加坡僧人所赠。
figures:
  - name: 慧云
    role: 僧人
    desc: 长安元年（701年）募银建寺。
  - name: 唐睿宗
    role: 皇帝
    desc: 延和元年（712年）诏改建国寺为大相国寺。御书寺名。
  - name: 空海
    role: 日本僧人
    desc: 寺内设大师堂纪念空海。堂内供奉其铜像。

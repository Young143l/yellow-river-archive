# 档案清单与进度台账
#
# 这是 80 条档案的唯一事实来源：谁负责、核到什么程度、正文在哪，都看这里。
# 正文内容在 packages/data/sites/<id>.yaml，本文件只存清单级元数据。
#
# 核实方式见 docs/data-verify-checklist.md；
# 为什么采用「领域知识初稿 + 人工核对」双轨，见 docs/decisions.md 的 ADR-022。

meta:
  version: '0.1.0'
  updatedAt: '2026-10-05'
  totalTarget: 80
  allocation:
    洛阳: 20
    郑州: 20
    开封: 16
    三门峡: 14
    濮阳: 10
  progress:
    已核: 8
    待核: 72
    存疑: 0
  confidenceLegend:
    high: 城市、时代、类型、级别均有把握（世界遗产或早期批次国保、知名遗址）
    medium: 主体信息有把握，批次或级别等某一项待确认
    low: 仅知大概，需逐字段核实后才能写正文
  statusLegend:
    已核: 已按核对清单确认过
    待核: 尚未人工确认
    存疑: 核对中发现矛盾，待仲裁
  rules:
    - 置信度为 low 的条目不得进入 P0 批次，且在核对完成前不写正文
    - 置信度为 medium 的条目可写正文，但必须在 notes 里写明待确认项
    - 每条进入 P0/P1 的档案必须至少有一个可访问的来源链接


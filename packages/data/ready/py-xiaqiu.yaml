summary: 瑕丘遗址位于濮阳县城东南，属龙山文化至商周时期聚落遗址。
intro: 该遗址又名负夏。位置在濮阳县城东南十八里固堆西。主体为高出地面十米的丘形台地。台地面积二千五百平方米。四周被水环绕。中央种植荷莲。现存清代观音庙建筑群。含东西厢房与后殿。清嘉庆九年知州李符清立有两通石碑。
archaeology: 考古采集到龙山文化陶片。还发现二里头文化陶片。另有商周时期陶片。器形包括陶盆、鬲、鼎等。这些遗存表明此处曾是古代部落居民点。台地高出地面十米。台地面积二千五百平方米。台地四周被水环绕。嘉靖《开州志》记载台地高五丈。台地纵横各十五丈。西侧附有一小丘。小丘高三丈。

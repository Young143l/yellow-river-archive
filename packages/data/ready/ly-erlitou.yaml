summary: 二里头遗址位于河南省洛阳市偃师区。主体遗存距今3800至3500年。学界普遍认定其为夏代中晚期都城。它是中国已确认年代最早的王朝都城。
intro: 遗址沿古伊洛河北岸呈西北—东南向分布。东西跨度约2400米。南北最宽约1900米。现存面积约300万平方米。原始聚落范围推测达400万平方米。中心区位于东南部微高地。宫殿区设于此处。宫城包围该宫殿区。祭祀区在宫城北侧。官营作坊区位于宫城南侧。围垣作坊区已被确认。贵族聚居区环绕宫城分布。西部地势较低。该区域属普通居民活动空间。中心区存在中国最早的道路网。道路呈‘井’字形布局。墙垣与道路共同划分功能区块。宫殿区处于都邑核心位置。宫城面积约10.8万平方米。这是中国迄今发现最早的宫城。作坊区出土青铜冶铸遗迹。该作坊为中国最早的青铜冶铸场所。作坊区还出土绿松石器制作遗存。这是中国最早的绿松石器作坊。2002年，一座贵族墓葬出土龙形器。墓葬位于3号宫殿南院。器物由2000多片绿松石镶嵌而成。龙身长度为64.5厘米。遗址出土乳钉纹铜爵。这是中国已知最早的青铜容器之一。遗址还出土网格纹铜鼎。它是目前考古所见年代最早的青铜鼎。
archaeology: 1959年夏季，徐旭生带队赴豫西调查‘夏墟’，首次识别出该遗址。此后六十多年持续开展田野工作。1977年，夏鼐依据新成果，正式命名此类遗存为‘二里头文化’。发掘分为三个阶段。第一阶段从20世纪60年代初延续至70年代末。此期确立一至四期文化序列。揭露1号与2号宫殿基址。确认青铜冶铸活动痕迹。第二阶段为80年代至90年代。此期以抢救性发掘为主。发现铸铜作坊。出土陶器、青铜器、玉器、漆器及绿松石制品。第三阶段始于90年代。此期重点勘探宫殿区。确认宫城城墙位置。清理多座大型建筑基址。2002年，3号宫殿南院一座贵族墓出土绿松石龙形器。2003年，确认宫城面积超过10万平方米。2004年，在2号宫殿基址下方发现更早的3号建筑基址。2022年，公布都邑多网格式布局成果。该发现入选当年全国十大考古新发现。2025年，偃师古城村遗址发现三条壕沟与夯土墙基。它们属于二里头文化时期。位置与二里头遗址隔洛河相对。方向和年代均一致。推测为都邑外围防御设施。

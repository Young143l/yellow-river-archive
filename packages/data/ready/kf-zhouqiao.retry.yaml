body: |-
  州桥遗址位于开封市鼓楼区。它是北宋东京城御街与汴河交汇处的关键地标。2018至2022年发掘确认多层桥体与道路垂直叠压。这一结构实证开封‘城摞城’现象。
  州桥遗址在河南省开封市鼓楼区。它位于北宋东京城南北中轴线御街和汴河交叉点。唐代建中年间，即公元780至783年，开始修建。初名汴州桥。五代时改称汴桥。北宋因汴河称天河，桥名更作天汉桥。民间通称州桥。1642年，明末崇祯十五年，黄河洪水将其完全掩埋。遗址地层含宋、金、元、明、清各期堆积。桥体与道路呈上下叠压状态。层理清晰可辨。这体现开封‘城摞城’的立体特征。自战国大梁起，黄河多次泛滥。开封城区地面抬升约8至10米。州桥位置锁定东京城布局核心坐标。它证明御街作为城市中轴线延续千年。州桥处于御街与汴河交汇处。该位置赋予其礼制功能。这种格局影响了金、元、明、清都城设计。北宋时期，州桥周边商业活跃。它记录了东京城从坊市分隔走向坊市融合的过程。
  2018至2022年，考古队系统发掘州桥遗址。现场发现桥体与道路多层叠压。共清理不同时期遗迹117处。出土文物标本超6万件。其中一幅北宋石雕祥瑞壁画体量最大。它是国内现存最完整的同类遗存。壁画嵌于宋代堤岸石壁表面。石壁由16层条石砌成。整体高度约为3.3米。瓷器类标本达5.6万余件。涵盖北宋、金、元、明、清五个时期。另有三尊铜像被发现。2022年9月28日，国家文物局通过‘考古中国’项目公布该遗址为重大成果。明代州桥遗存反映开封在明初作为陪都的历史地位。
  唐建中年间
  州桥始建
  州桥始建于唐代建中年间，即公元780至783年。最初命名为汴州桥。
  1642年
  洪水淤埋
  1642年，明末崇祯十五年，州桥遭黄河洪水彻底掩埋。
  2018—2022年
  考古发掘
  2018至2022年开展考古工作。确认桥体与道路多层叠压现象。清理遗迹117处。获取文物标本超6万件。
  2022年
  重大发现发布
  2022年9月28日，国家文物局‘考古中国’项目通报州桥汴河遗址为重大考古成果。
  2023年
  入选十大发现
  2023年3月28日，‘河南开封州桥及附近汴河遗址’列入2022年度全国十大考古新发现。
  北宋石雕祥瑞壁画
  这是国内现存最完整的北宋大型石雕祥瑞壁画。它位于宋代堤岸石壁上。石壁用16层石块垒砌。总高约3.3米。

  宋金元明清瓷器标本
  共出土5.6万余件瓷器标本。时间跨度为北宋、金、元、明、清各时期。为器物类型演变研究提供直接证据。

  东京梦华录（节选）
  孟元老
  宋
  次曰州桥（正名天汉桥），正对于大内御街，其桥与相国寺桥皆低平不通舟船，唯西河平船可过，其柱皆青石为之，石梁石笋楯栏，近桥两岸，皆石壁，雕镌海马水兽飞云之状，桥下密排石柱，盖车驾御路也。
  此段出自《东京梦华录》，属宋代文献记载，用于佐证州桥形制。



  2025年12月28日起，开封ROAM BUS-乐游专线投入试运行。单程票价3元。线路覆盖范围小。发车频次高。支持线上预约。乘客可在站点招手乘车。该线路经过州桥遗址。

body: |-
  含嘉仓遗址是隋唐洛阳城内的国家级粮仓。唐代储粮量占全国主要大型粮仓总储量近一半。2014年作为中国大运河遗产点列入世界遗产名录。
  含嘉仓遗址位于河南省洛阳市瀍河回族区春都东路一带。遗址北依邙山。南邻洛阳老城。陇海铁路穿行于遗址区域。仓城呈长方形。东西宽六百一十二米。南北长七百一十米。总面积约四十三万平方米。城墙环绕仓城四周。设有四座城门。城内有十字形街道。街道将仓城划分为三个区域：粮窖区、生活管理区、漕运码头区。
  遗址发现于二十世纪六十年代末。发现地点是焦枝铁路机修车间工地。最初误判为八角形墓葬。后在窖底出土铭砖。据此确认为古代粮仓。一九七一年获国家文物局批准。正式考古发掘启动。首批清理五座仓窖。其中一六零号仓窖存有部分粮食。截至二零一三年。共发掘十九座仓窖。九座内出土铭砖。
  605
  始建含嘉仓
  含嘉仓始建于隋大业元年。其大规模储粮及‘天下第一粮仓’地位形成于唐代。
  20世纪60年代末
  遗址被发现
  焦枝铁路施工中发现遗址。依据窖底铭砖文字确认为古代粮仓。
  1971
  首次考古发掘
  国家文物局批准开展发掘。重点清理一六零号仓窖。
  2014
  列入世界遗产
  中国大运河申遗成功。含嘉仓作为遗产点入选世界遗产名录。
  含嘉仓刻铭砖
  唐代方形铭砖。正面经打磨处理。文字分墨书与阴刻两类。记载仓窖位置、粮食来源、品种、数量、存放日期及管理官吏姓名。
  洛阳博物馆
  史家珍
  考古学者
  曾任洛阳市文物考古研究院院长。参与含嘉仓发掘研究。分析仓窖建造工艺与选址依据。
  方孝廉
  考古学者
  指出含嘉仓建于地势高处。土质干燥。地下水位低。结构设计利于防潮保温。
  余扶危
  考古学者
  参与铭砖考证。认为铭砖证实含嘉仓身份。反映唐代粮食管理制度化与科学化。
  王炬
  考古学者
  洛阳市文物考古研究院隋唐研究室副研究员。介绍已勘探粮窖二百八十七座。一六零号窖存炭化谷物约五十万斤。
  9:00—17:00（16:30停止入场）


  须持预约码或身份证，按预约时段入馆。六十周岁以上游客可刷身份证直接入馆。
  所有参观者均需接受安全检查。严禁携带易燃易爆物品、管制器具等危险品。
  展厅内禁止使用闪光灯拍照。禁止架设三脚架。
  该遗址与回洛仓遗址均为大运河世界文化遗产点。由隋唐大运河文化博物馆统一管理。

body: |-
  山陕甘会馆坐落于开封市龙亭区徐府街北侧。建成于清乾隆四十一年（1776年）。建在明代徐达府旧址上。由山西、陕西、甘肃三省旅汴富商共同捐资兴建。以砖雕、木雕、石雕技艺著称。2001年被列为第五批全国重点文物保护单位。
  会馆坐北朝南。总占地3870.29平方米。采用四合院式布局。主体建筑沿中轴线自南向北排列。最南端是照壁。其后依次为戏楼、牌楼、正殿。东西两侧设掖门、垂花门、钟楼、鼓楼、厢房及跨院。照壁高8.6米。长16.5米。厚0.65米。檐下满布砖雕。牌楼为三间六柱五楼式。柱网呈三角鼎立状。民间称鸡爪牌坊。正殿由拜殿、卷棚、大殿三部分连通构成。总面积540平方米。装饰集中体现砖雕、木雕、石雕工艺。照壁砖雕含狮子绣球、松鼠葡萄等题材。牌楼抱鼓石刻有苍龙行云、丹凤朝阳纹样。拜殿木雕自挑檐桁至额枋共分七层。会馆兼具祭祀与会馆功能。主祀关羽。服务异地商人生活。强化商帮内部认同。弘扬晋商信义精神。三类雕刻并称会馆三绝。
  现存建筑群属于关帝庙部分。1986年整修确认了整体格局与地坪标高。整修由河南省古代建筑研究所等单位承担。因长期水患淤积。全院地坪整体下挖60厘米。共清运土方2000立方米。清代原始地坪由此恢复。现存戏楼并非原构。原戏楼毁于文革时期。现戏楼系从开封火神庙迁建而来。为开封现存唯一古代戏楼。钟楼与鼓楼保存完整。东楼悬铸铁钟一口。西楼置鼓一面。钟高约一人多。表面铸有八卦符。钟纽为龙兽造型。卷棚内石案制于清嘉庆十二年（1807年）。正面浮雕八仙庆寿图案。
  清康熙年间
  山西会馆始建
  山西旅汴客商在老会馆街创建山西会馆。
  1765年
  改名迁建
  乾隆三十年更名为山陕会馆。迁址徐府街重建。
  1776年
  三省集资修建
  乾隆四十一年三省富商于徐达府址共建会馆。
  1986年
  全面整修
  河南省政府启动关帝庙部分修复工程。
  2001年
  列入国保
  国务院公布为第五批全国重点文物保护单位。
  石案
  置于卷棚内。清嘉庆十二年（1807年）制作。正面雕八仙庆寿图。

  铸铁钟
  悬挂于钟楼。高约一人。铸有八卦符号。钟纽为龙兽形制。

  徐达
  明代开国元勋、中山王
  会馆建在其明代府邸旧址之上。



  1988年10月24日对外开放。
  钟楼可登临。鼓楼不开放。
  现存戏楼为开封仅存古代戏楼。由火神庙迁移安置。

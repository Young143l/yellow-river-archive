body: |-
  关林位于洛阳市洛龙区关林镇。此处安葬关羽首级。建筑群前为祠庙，后为墓冢。它是全国唯一冢、庙、林三祀合一的古建筑。主体建于明代，清代扩建。
  关林地处洛阳市洛龙区关林镇。北邻隋唐故城。南近龙门石窟。西接洛龙大道。东傍伊水。明万历年间开始营建。清乾隆时期增修。中轴线自南向北排列大门、仪门、甬道、拜殿、大殿、二殿、三殿、石牌坊、林碑亭、关墓。两侧建筑左右对称。1980年设立洛阳古代艺术馆。馆内陈列洛阳出土石刻与碑志。2006年成为全国重点文物保护单位。2008年被定为国家级非物质文化遗产‘关公信俗’遗产地。
  关林核心遗存是关羽墓冢。传说埋藏其首级。冢高17米。占地2600平方米。南墙石墓门建于康熙五十六年。门额题‘钟灵处’。墓冢起源于汉末。今覆绿草。‘关林翠柏’列入洛阳八小景。庙内存明清石牌坊、奉敕碑亭等石刻。‘忠义神武灵佑仁勇威显关圣大帝林’碑立于碑亭内。此碑是关林得名的关键实证。
  220年
  曹操葬关羽
  孙权将关羽首级送至洛阳。曹操以王侯之礼安葬于洛阳城南十五里。并建庙祭祀。
  1592年
  扩建关林庙
  明万历二十年，在汉代关庙旧址上扩建。占地逾200亩。形成四进院落。
  1666年
  敕封关林
  清康熙五年敕封洛阳关帝陵为‘忠义神武关圣大帝林’。正式启用‘关林’名称。
  2006年
  列入国保
  关林作为明至清古建筑。被国务院公布为第六批全国重点文物保护单位。
  2008年
  关公信俗申遗成功
  ‘关公信俗’入选国家级非物质文化遗产名录。关林为其指定遗产地。
  “忠义神武灵佑仁勇威显关圣大帝林”碑
  该碑立于奉敕碑亭内。记载关羽生平、历代封号及建庙过程。是关林称‘林’的核心物证。

  “关圣帝君之宝”玉玺
  刘中州篆刻。重1800余千克。供奉于拜殿。西泠印社副社长誉为‘世界关庙第一印’。

  明代铁狮
  仪门左右各立一尊。每尊重3000余斤。为明代信众敬奉关公所铸。

  关羽
  墓主
  三国时期蜀汉将领。相传首级埋葬于关林墓冢。
  曹操
  葬关羽者
  220年以王侯之礼安葬关羽首级于洛阳城南十五里。并建庙祭祀。
  孙权
  传首级者
  关羽败走麦城后。将其首级送至洛阳曹操处。
  8:30—18:00


  可乘55路、58路、69路、15路、39路、71路、81路公交车直达。
  每年9月29日举办关林国际朝圣大典。海外关庙代表与宗亲组织集中朝拜。
  ‘关林翠柏’为洛阳八小景之一。大雨初晴时云气缭绕冢周。

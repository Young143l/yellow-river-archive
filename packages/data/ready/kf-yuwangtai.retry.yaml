body: |-
  禹王台位于开封市东南隅。初名吹台，相传为春秋晋国音乐家师旷奏乐处。明代嘉靖二年建禹王庙后更名。现为河南省文物保护单位。存有明清至民国碑刻多通。
  禹王台在开封市禹王台公园内。最早称吹台。师旷曾在此奏乐。西汉梁孝王刘武扩建台基，增建殿宇亭楼，形成梁园。宋代建二姑庙。金元后建筑渐废。明成化十八年建碧霞元君祠。正德十二年改祀李白、杜甫、高适，立三贤祠。嘉靖二年建禹王庙，台名正式改为禹王台。此后明清多次修缮。现存牌坊、御书楼、禹王庙、三贤祠、水德祠、御碑亭。主体格局定型于1981年重修。1986年11月21日公布为第二批河南省文物保护单位。
  禹王台现存建筑群为1981年重修。主要建筑包括牌坊、御书楼、禹王庙、三贤祠、水德祠和御碑亭。禹王庙大殿北壁嵌有岣嵝碑。该碑刻于光绪二十三年。由河南巡抚刘树堂摹刻。全文共77字。文字古奥。传原碑在湖南衡山岣嵝峰。三贤祠内立有嘉靖二年禹庙记碑。李梦阳撰文。左国玑书写。碑为双面刻。风格浑厚庄重。祠东西墙存正德九年时雨亭记与抚安亭记碑。作者为陈珂。立碑者为贺锐。朵廊存康熙三十三年顾汧所撰碑。题为《御书功成河洛匾额四道恭颂并序》。台上另有嘉靖四十一年吹台五贤祠记碑。还有康熙七年重建禹庙记碑。康熙三十年重修禹王台碑。道光十年修复三贤祠记碑。民国五年森林局拓地碑。民国十八年河南农林试验总场记略碑。1985年文物普查发现六通康熙御笔石刻。其中含‘功存河洛’碑。均带‘康熙御笔’印玺。
  1482
  建碧霞元君祠
  明成化十八年。河南参政吴节主持在荒台建造碧霞元君祠。
  1523
  建禹王庙
  明嘉靖二年。开封屡遭黄河水患。当局建禹王庙纪念大禹治水。吹台自此更名禹王台。
  1694
  御颁匾额
  清康熙三十三年。朝廷赐‘功存河洛’匾额予禹王庙。专建御书楼收藏。
  1981
  重新修葺
  禹王台建筑群全面整修。形成今日布局。
  1986
  列入省保
  1986年11月21日。禹王台被公布为第二批河南省文物保护单位。
  岣嵝碑
  光绪二十三年河南巡抚刘树堂摹刻。共77字。文字古拙。传原碑在湖南衡山岣嵝峰。

  康有为《游禹王台诗》石刻
  民国十二年康有为游汴即兴赋诗。刻石10块。嵌于御书楼一楼东壁。

  乾隆御诗碑
  乾隆十五年乾隆登吹台所作五言律诗。后人刻石立于御碑亭。

  禹庙记碑
  明嘉靖二年所立。李梦阳撰文。左国玑书丹。双面刻字。是禹王台重要碑刻。

  康熙御笔“功存河洛”石刻
  1985年文物普查中。在开封师范学校后院北墙发现。带‘康熙御笔’印玺。

  师旷
  春秋晋国音乐家
  相传春秋时师旷曾在吹台奏乐。台因此得名吹台。
  刘武
  西汉梁孝王
  西汉初年。梁孝王刘武扩建吹台。修建殿宇亭楼。建成梁园。
  吴节
  明河南参政
  明成化十八年主持在荒台建碧霞元君祠。
  毛伯温
  明按察御史
  明正德十二年将碧霞元君像移出。改祀李白、杜甫、高适。设立三贤祠。
  刘树堂
  清河南巡抚
  光绪二十三年摹刻岣嵝碑于禹王庙大殿北壁。
  康有为
  近代学者
  民国十二年游汴时即席创作《游禹王台诗》。刻石留存。
  游禹王台诗
  康有为
  民国
  短槐高柳绿皆新。长治园亭泽似春。碑前拓影留后因。鹦鹉解语花馥芬。
  1923年康有为游汴即席所作。石刻10块嵌于御书楼一楼东壁。



  禹王台位于开封市禹王台公园内。该园1955年正式开放。
  园内后增设樱花园、牡丹园、儿童乐园等景点。
  ‘古吹台’木牌坊初建于清乾隆二十七年。道光二十九年重建。
  御书楼二楼原悬康熙‘功存河洛’木匾。今石刻存于开封师范学校旧址。
  禹王庙大殿内塑像为1981年依大禹陵样式重塑。高五米。材质为古膏。

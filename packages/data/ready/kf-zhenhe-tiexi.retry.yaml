body: |-
  镇河铁犀位于开封市龙亭区铁牛村。它铸于明正统十一年（1446年）。主持铸造者是河南巡抚于谦。目的是应对黄河水患。犀背铭文为于谦所撰《镇河铁犀铭》。
  铁犀坐南向北，正对黄河方向。通高2.04米。围长2.66米。重量约千斤。通体呈乌黑色。头顶生单角。双眼圆睁。前肢撑地而立。整体造型威严有力。最初安放于回龙庙内。该庙坐北朝南。庙门面向开封城。庙后背靠黄河。于谦遇害后。百姓在庙旁建庇民祠纪念其治河功绩。铁犀曾三次被黄河泥沙掩埋。每次均被重新发掘并复位。古人认为铁属金。金能生水。犀牛属坤土。土可克水。因此铸铁犀以镇水。1963年。它被列为河南省首批省级重点文物保护单位。2025年3月14日。它入选首批黄河水利遗产名录。
  铁犀不是考古发掘所得。它是明代有明确纪年的铸铁遗存。铭文与年代直接铸于本体表面。铸造时间为正统十一年（1446年）。于谦主持铸造并亲撰铭文。初置地点为黄河岸边新建的回龙庙。崇祯十五年（1642年）。黄河决口。回龙庙与庇民祠同时被毁。铁犀随之深埋地下。顺治年间。人们将其掘出。康熙三十年（1691年）。巡抚阎兴邦主持重修庙宇。庙名更改为镇河铁犀庙。并立碑记录此事。道光二十一年（1841年）。张湾段黄河再次决口。庙宇再度被毁。铁犀本体幸存。1940年。侵华日军试图运走铁犀熔炼军火。铁牛村村民组织保护。最终追回原物。2019年。铁犀及周边设施损毁严重。检察机关介入调查。相关部门出资110余万元启动修缮。工程包括加固青石基座。修缮铁犀亭及两座凉亭。清洗修复五通石碑。重建300米院墙。2020年3月底。修缮完工并通过验收。该遗存是研究明代黄河治理实践与民间镇水观念的重要实物证据。
  1446
  于谦铸犀
  正统十一年。于谦主持铸造铁犀。铭文《镇河铁犀铭》铸于犀背。铁犀安置于新建回龙庙中。
  1642
  庙毁犀埋
  崇祯十五年。黄河决口。回龙庙与庇民祠被毁。铁犀被泥沙掩埋。顺治年间重见天日。
  1691
  重修铁犀庙
  康熙三十年。阎兴邦主持重修。回龙庙更名为镇河铁犀庙。并立碑记载重修经过。
  1940
  村民护犀
  日军企图掠走铁犀。铁牛村村民全力阻止。成功追回原物。
  1963
  列入省保
  1963年6月22日。它被公布为河南省第一批省级重点文物保护单位。
  2025
  入选水利遗产
  2025年3月14日。它被列入首批黄河水利遗产名录。
  于谦
  明代河南巡抚，铁犀主持铸造者
  宣德五年（1430年）出任河南巡抚。主持疏浚河道、加固堤防。正统十一年（1446年）铸铁犀并撰铭。天顺元年（1457年）遇害。开封百姓建庇民祠纪念其治河之功。
  阎兴邦
  清代河南巡抚
  康熙三十年（1691年）主持重修庙宇。将回龙庙改称镇河铁犀庙。并立碑说明重修缘由。
  镇河铁犀铭
  于谦
  明
  百炼玄金，溶为金液。变幻灵犀，雄威赫奕。填御堤防，波涛永息。安若泰山，固若磐石。水怪潜形，冯夷敛迹，城府坚完，民无垫溺……




  原物保存在开封城东北铁牛村。柳园口黄河游览区设有一尊按原物翻铸的复制品。复制品面朝黄河供游客参观。
  2019年至2020年完成全面修缮。院落已绿化。地面铺设砖面。文物部门安排专人日常管护。
  推荐游览线路：开封黑岗口调蓄水库—镇河铁犀—黑岗口黄河观景台—黄河生态廊道—林则徐治河文化广场—黄河湿地公园休闲观光园区—黄河湾风景区。

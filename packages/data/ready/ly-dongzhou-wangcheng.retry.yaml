body: |-
  东周王城遗址位于洛阳市西工区王城公园一带。它是东周时期的都城遗址。城址平面大体呈方形。包含宫殿区、手工业作坊、仓窖和‘天子驾六’车马坑。
  该遗址地处河南省洛阳市西工区中州中路312号王城公园及周边。城址中部叠压着汉代河南县城。四面由夯土城墙围合。整体轮廓接近正方形。周长约为15公里。总面积约9平方公里。始建时间在春秋中期。战国至秦汉时期多次修缮。
  北城墙全长2890米。厚度为8至10米。东城墙现存长度1800米。厚度约5米。西城墙沿涧河东岸曲折南延。厚度也约为5米。南城墙残存800余米。厚度约14米。
  北墙外有一条东西向水道。东墙东侧有一条南北向水道。两者应为护城壕。四面城墙均未确认城门位置。
  城址北部集中分布制陶、制骨与铸铜作坊。其中制陶遗址规模较大。发现窑址、房屋、水井、陶片及制陶工具。
  西南部瞿家屯村东北区域发现两组南北相邻的大型建筑基址。近年又探明三处大型夯土基址。位置与文献记载的王宫相近。学界普遍认为此处是宫殿区。
  宫殿区以主殿为核心布局。左右对称。院落划分为多个独立单元。各单元呈四合院式。亦围绕中轴线对称分布。
  宫殿区东侧、瞿家屯村东北已探明粮窖80余座。城外还发现馆驿类建筑遗迹。
  遗址内出土多座高等级墓葬和车马坑。2002年发掘的‘天子驾六’车马坑保存完好。
  该遗址体现‘面朝后市’的空间结构。为研究周代都城制度提供关键实证。是洛阳五处都城大遗址之一。对理解东周历史和中国古代都城演进具有重要价值。也为探讨周代政治、经济与文化提供实物资料。
  1954年，中央文化部派考古队赴洛阳。目标是配合城市建设，定位东周王城确切位置。同年在中州路西工段发掘260座东周墓。这些墓多数为长方形竖穴墓。
  1957年，中国科学院考古研究所洛阳工作站于汉屯路钻探出四座‘甲’字形东周墓。编号为M1至M4。M1随后被清理。出土一件石圭。表面有墨书‘天子’二字。
  1958年，经持续调查与发掘，在洛河北岸、涧河两岸确认东周王城范围。
  1973年10月到1974年2月，洛阳市文物工作队发掘四号墓。这是一座战国中期大墓。共出土器物1637件。材质涵盖铜、铁、玉、石、骨、蚌、陶、玻璃、玛瑙、料器。其中铜器与铁器合计148件。
  2001年，为配合车马坑广场建设，发掘200多座东周墓和十余座车马坑。‘天子驾六’车马坑即在此时发现。同年内，洛阳市第二十七中学校园内还发掘一座‘十’字形大墓和一座‘甲’字形大墓。二者均为王、侯级别。
  ‘天子驾六’车马坑长42.6米。宽7.4米。共清理马匹68匹。车辆26辆。六马驾车组合位于坑东南部。
  2004年，考古队发掘瞿家屯大型夯土基址。该基址位于南城墙外侧。
  2013年7月至12月，洛阳市文物考古研究院配合旧城改造项目，发掘两段西城墙和一段南城墙。出土遗物主要是建筑构件和陶器残片。
  1954
  进驻洛阳勘察
  中央文化部组织考古人员进入洛阳。任务是配合城市规划，明确东周王城具体位置。
  1958
  确认城址位置
  经过数年田野工作，在洛河北岸、涧河两岸确定东周王城所在区域。
  2002
  天子驾六发掘
  配合中心广场施工，发现‘天子驾六’车马坑。证实周代高级别车马制度。
  2013
  公布为国保
  2013年3月5日，国务院将其列入第七批全国重点文物保护单位。
  2021
  入选百大发现
  2021年10月，该遗址入选‘百年百大考古发现’名单。
  石圭
  1957年出土于小屯村东北东周王城M1。表面残留墨书‘天子’二字。

  铜铃
  出自洛阳西郊四号墓。属于该墓所出铜、铁乐器类器物。

  陶拍与陶支垫
  用于制陶与烧陶。分别见于1992年觅乐宫窑址Y1和1998年战国陶窑遗址。

  卷云纹半瓦当
  2013年西城墙与南城墙遗址发掘所得建筑材料残片。




  遗址位于洛阳市西工区中州中路312号王城公园及周边。
  可乘101路、102路、103路、9/K9路、11/K11路等公交至王城公园站。

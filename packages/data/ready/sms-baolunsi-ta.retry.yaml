body: |-
  宝轮寺塔位于河南三门峡陕州风景区。隋仁寿元年（601年）始建木塔。金大定十七年（1177年）重建为砖塔。塔内回声似蛙鸣，民间习称‘蛤蟆塔’。2001年列入第五批全国重点文物保护单位。
  该塔为13级叠涩密檐式砖塔。总高26.5米。底部周长21.6米。塔身轮廓呈抛物线状。塔门朝南。平面为正方形。青灰砖一顺一丁砌筑。白灰作粘合剂。每层设拱券门、佛龛与窗洞。塔内有塔心室和垂直梯道。第二级南面嵌石刻塔铭。铭文含‘三圣舍利塔’及建塔起讫时间。外形仿唐制。内部结构依宋法。兼具唐宋密檐式塔与楼阁式塔特征。是建筑史与佛教史的重要实物。
  现存塔体建于金大定十七年（1177年）。由僧人智秀主持重建。原宝轮寺已毁。塔铭尺寸为40×30厘米。嵌于第二级南面。铭文为‘三圣舍利塔’及‘大定十六年四月五日起塔，十七年五月初八日竣工’。塔身经历16次地震。主体结构未损。1991年7月至11月实施修复。参照沁阳天宁寺塔形制。未整体扶正塔体。其余部分均按原貌复原。20世纪90年代末再次维修。校正了塔基活动导致的倾斜。西壁龛存唐代残石经幢。雕有一佛二菩萨像。东壁龛原有石刻造像。现已无存。
  601年
  仁寿建塔
  隋文帝仁寿元年，尼姑道秀主持建造木塔。用途是供奉舍利。
  1177年
  智秀重建
  金大定十七年，僧人智秀主持重建为砖塔。原宝轮寺当时已毁。
  1991年
  文物修复
  1991年7月至11月，文物部门开展修复工程。以沁阳天宁寺塔为形制依据。
  2001年
  列入国保
  2001年6月25日，国务院公布其为第五批全国重点文物保护单位。
  唐代残石经幢
  现存于塔西壁龛内。雕刻内容为一佛二菩萨像。是塔内保存最早的佛教石刻遗存。

  石刻塔铭
  位于塔第二级正面。尺寸为40×30厘米。文字含‘三圣舍利塔’及金代建塔起讫日期。为断代核心依据。

  道秀
  隋代建塔主持者
  隋文帝仁寿元年，尼姑道秀主持修建木塔。用于安放舍利。
  智秀
  金代重建者
  金大定十七年，僧人智秀主持将塔重建为砖结构。
  夏季开放时间为8:00至18:30。秋季开放时间为8:00至18:00。


  可乘三门峡市内公交1路或2路，在陕州风景区站下车后步行到达。
  游客在塔周围数丈处叩击石块或拍手，能听到类似蛙鸣的回声。
  击掌节奏越快、声音越响，回声越清晰、越响亮。

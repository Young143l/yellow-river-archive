summary: 普照寺大雄宝殿在河南省清丰县城西南角。它是原圆明寺仅存的古建筑。建于1485年。面宽五间。进深三间。屋顶为单檐庑殿式。脊用绿琉璃。属河南省文物保护单位。
intro: 大雄宝殿是普照寺现存唯一古建。该寺初名圆明寺。创建于760年。1282年更名普照寺。元末毁于战乱。明洪武年间重建二百余间殿宇。现存大雄宝殿落成于1485年。殿身宽五间。深三间。占地248.92平方米。结构为单层庑殿式。屋脊铺绿彩琉璃。前壁装朱漆木格窗。殿内立四列纵柱、六排横柱，共二十四根合抱明柱。正壁铸三尊丈高铜佛。四周塑十八尊泥质罗汉。四壁刻唐僧西天取经浮雕。顶部呈圆形。绘沥粉金龙四条。中心为八卦图。1980年定为县级文保单位。1986年升为省级文保单位。
archaeology: 该殿未开展考古发掘。保护工作始于1980年。当年列为县级文物保护单位。1986年升为省级文物保护单位。同年获拨款15万元修缮。耗木材70余方。修后恢复明代木构原貌。殿内保留铜佛三尊。泥塑罗汉十八尊。四壁存唐僧西天取经浮雕。顶部有沥粉金龙四条。中央绘八卦图。2012年6月，全堂佛像完成贴金。

summary: 蒯聩台遗址位于河南濮阳，属新石器时代至汉代文化遗存。它因春秋时期卫国蒯聩父子争位事件得名。现为河南省省级文物保护单位。
intro: 遗址地处濮阳市华龙区帝丘路与建设东路交叉口西北130米。它靠近戚城遗址，直线距离约1.5公里。现存台地面积约为600平方米。台体比周边地面高出7米至10米。原址总面积约6万平方米。台基轮廓为长方形。南北方向长度260米。东西方向宽度110米。台周总长740米。文化层由下至上依次为仰韶文化、龙山文化、晚商、春秋和汉代堆积。
archaeology: 1985至1987年，河南省文物研究所开展考古发掘。发掘工作配合油田建设进行。实际发掘面积450平方米。发现仰韶文化至汉代连续五期遗存。各时期遗迹保存良好。出土陶器、石器、骨器等大量器物。珍贵文物总数逾5000件。文化层叠压关系明确。该遗址支撑濮阳地区文化序列研究。它也助力春秋战国卫国历史研究。
events:
  - year: 1985—1987年
    title: 科学发掘
    desc: 河南省文物研究所实施考古发掘。发掘面积达450平方米。确认遗址包含仰韶文化、龙山文化、晚商、春秋和汉代五期堆积。
  - year: 2000年9月
    title: 列入省保
    desc: 河南省人民政府将其公布为省级重点文物保护单位。
  - year: 1991年2月5日
    title: 江泽民视察
    desc: 中共中央总书记江泽民到濮阳考察。讲解员孙德萱介绍当地文物古迹时提到该遗址。
artifacts: []
figures:
  - name: 蒯聩
    role: 卫灵公太子、卫庄公
    desc: 他是卫灵公的太子。曾刺杀庶母南子失败。随后逃往晋国。卫出公继位后，他被晋国护送返卫。他在此台暂避。他与儿子争夺君位长达13年。遗址因此得名。
  - name: 子路
    role: 孔悝家臣
    desc: 他是孔悝的家臣。公元前480年，蒯聩劫持孔悝。子路坚持‘食其禄不能避其难’。他在营救孔悝时战死。
  - name: 孙德萱
    role: 讲解员
    desc: 1991年2月5日，她在江泽民视察濮阳期间介绍文物古迹。她向领导人提及蒯聩台遗址。

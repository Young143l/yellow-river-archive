body: |-
  洛阳周公庙又名元圣庙。它位于洛阳市中心。始建于隋大业十四年（618年）。现存建筑为明清时期遗存。2006年成为全国重点文物保护单位。
  该庙坐北朝南。三面临街。南邻五贤街。西接定鼎路。北靠周公路。中轴线上依次为定鼎堂、礼乐堂、先祖堂及东西两庑。它是洛阳市保存较完好的明清建筑群之一。定鼎堂建于明嘉靖四年（1525年）。属单檐歇山式建筑。面阔五间。总宽22.4米。进深三间。总深16.8米。屋顶铺青筒瓦。屋脊用绿琉璃瓦剪边。脊上饰龙凤纹与吻兽。四角飞檐向上翘起。柱身被加高。山面斗拱做法特殊。斗拱数量少于常见明清建筑。具有辽金建筑风格特征。古建专家郑孝燮称其为艺术杰作。礼乐堂原名会忠祠。为硬山式屋顶。覆灰瓦。面阔五间。进深两间。定鼎堂内供奉周公、召公、毕公、伯禽、君陈五尊圣像。殿内墙壁绘有周公史迹图。礼乐堂陈列分封诸侯塑像一组。另展石磬、编钟各一套。庙内有一处高大土墩。院西洛阳日报社院内也有一处土墩。二者东西相对。这是隋唐故皇城正门端门的遗址。
  1992年修复定鼎堂时发现一尊明代伯禽彩绘泥塑像。该像藏于墙内。时间为民国二十一年（1932年）。造像高2.45米。宽0.9米。比例修长。造型端庄。静立于正方形石座上。它是洛阳周公庙仅存的古代供奉塑像。也是河南省保存较大的明代泥塑造像之一。
  618
  王世充草创
  隋大业十四年。隋将王世充创建周公庙。借周公显灵稳定军心。
  1525
  嘉靖重建
  明嘉靖四年在旧址重建。定鼎堂建于此时。
  1932
  藏像入墙
  民国二十一年重修庙宇。伯禽像被封入墙体。
  1963
  列省保
  洛阳周公庙成为河南省第一批重点文物保护单位。
  2006
  列国保
  2006年5月25日列为第六批全国重点文物保护单位。
  伯禽彩绘泥塑像
  明代大型泥塑彩绘像。高2.45米。宽0.9米。是洛阳周公庙仅存的古代供奉塑像。属河南省保存较大的明代泥塑造像之一。

  周公姬旦
  西周政治家、思想家
  西周政治家、军事家、思想家。古代洛阳城缔造者。儒家思想奠基人。庙宇主祀神。
  王世充
  隋将
  隋大业十四年草创周公庙。借周公显灵稳定军心。
  戴传贤
  国民政府考试院院长
  民国二十一年题写定鼎堂匾额。以蒋介石名义重修周公庙。立《重修洛阳周公庙碑》。
  郑孝燮
  古建专家
  评价定鼎堂为保留辽金建筑风格的艺术杰作。



  可乘26路公交至凯旋东路定鼎大道口西站。步行约430米。
  可乘305路公交至应天门站。步行约350米。

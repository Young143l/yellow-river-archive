figures:
  - name: 王喆
    role: 全真教创始人
    desc: 号重阳子。陕西咸阳人。金世宗大定九年（1169年）率四弟子抵开封。寓居王氏旅店。不久在此逝世。
  - name: 王志谨
    role: 全真教道士
    desc: 号栖云真人。奉丘处机之命主持重阳观重建。工程未竣即去世。
  - name: 徐志根
    role: 全真教道士
    desc: 号洞阳真人。接续营建重阳观。前后历时近三十年。建成宏大道观。

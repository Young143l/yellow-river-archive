summary: 延庆观在河南省开封市包公湖东北部。初名重阳观。为纪念全真教创始人王喆建。现存建筑只有元代玉皇阁。属全国重点文物保护单位。
intro: 它地处开封包公湖东北侧。东边靠近大相国寺。西边紧挨包公湖。南面连接开封府。北面毗邻清明上河园。始建于1233年。原称重阳观。1373年更名为延庆观。专为纪念王喆传道并卒于此地而设。现仅余玉皇阁一座。占地1500平方米。院落分中、左、右三路。
archaeology: 1985年启动玉皇阁修缮工程。国家文物局提供专项经费。穿心殿同期重建。施工中发现深埋地下3米多的基座。该基座已存在750余年。修复后基本还原原有形制。玉皇阁全部用砖砌筑。采用砖墙穹顶结构。这类结构多见于元代伊斯兰教建筑。在道教建筑中十分少见。2008年11月21日完成整体顶升。阁体抬升3.1米。有效阻断地下水侵蚀。地下宫殿位于玉皇阁正下方。面积超300平方米。含走廊、回廊和中心区。地宫陈列玉皇阁顶升全过程。
events:
  - year: 1233年
    title: 始建重阳观
    desc: 全真教徒依丘处机遗训重建重阳观。工程持续约三十年。
  - year: 1373年
    title: 改名延庆观
    desc: 明朝洪武六年恢复道观功能。正式定名延庆观。同时改建大殿。
  - year: 1985年
    title: 修葺玉皇阁
    desc: 国家文物局拨款开展维修。穿心殿同步复建。基座被清理出土。
  - year: 1988年
    title: 列入国保
    desc: 国务院公布为第三批全国重点文物保护单位。
  - year: 2008年
    title: 整体顶升
    desc: 玉皇阁实施整体抬升作业。升高3.1米。解决地下水侵害问题。
artifacts:

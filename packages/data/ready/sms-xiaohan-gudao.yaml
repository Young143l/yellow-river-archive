summary: 崤函古道石壕段在河南三门峡陕州区。它是汉唐时期长安至洛阳通道的组成部分。2014年成为丝绸之路世界遗产点。路面存有车辙与蹄印等痕迹。
intro: 遗址位于三门峡市陕州区硖石乡车壕村东南约一公里。它离三门峡主城区三十六公里。所在区域属秦岭东段余脉的丘陵地形。古道顺应自然地势修建。路线呈S形走向。整体方向由西北向东南。现存道路遗存长度超一千三百一十七米。已考古揭露的石质路段长二百三十米。路面最宽处为八点八米。最窄处为五点二米。材质是石灰岩。北段设单行车道。车道北侧配有蓄水设施。该设施由天然坑洼整修而成。南段地势较高且坡度较陡。路基下方铺有垫石层。周边还发现石质古道、土质古道、驿站遗址和烽燧遗址。
archaeology: 考古工作重点是路面清理与周边探查。古道全长一千三百一十七米。其中经发掘确认的石质路段长二百三十米。路面保留车辙与蹄印。车辙印痕分三种类型。最深达零点四一米。最浅仅数厘米。石坂坡上车辙痕迹延展百余米。辙宽一点零六米。壕深零点二五米。二车道中部留有马蹄形石印。深度零点五厘米。由马匹反复踩踏形成。路面还有骆驼蹄印与纤夫手抠痕迹。现场保存饮马坑与拴马石。另有修凿痕迹及修路台面遗迹。二零一四至二零一六年新发现十余处遗迹。含烽火台五处。石质车辙三处。灶台一处。歇车坪一处。停车场看守遗址一处。
events:
  - year: "2006"
    title: 列入省保
    desc: 二零零六年六月八日，遗址被定为河南省第四批文物保护单位。
  - year: "2014"
    title: 列入世遗
    desc: 二零一四年六月二十二日，遗址作为丝绸之路遗产点进入《世界遗产名录》。
  - year: "2019"
    title: 列为国保
    desc: 二零一九年，遗址升格为全国重点文物保护单位。

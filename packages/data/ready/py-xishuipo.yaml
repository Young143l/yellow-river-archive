summary: 西水坡遗址位于河南濮阳，属仰韶文化聚落与墓葬遗址。出土距今约6500年的蚌塑龙虎图案，被称作「中华第一龙」出土地。
intro: 西水坡遗址在河南省濮阳市濮阳县西南隅。遗址面积约5万余平方米。年代跨度从新石器时代仰韶文化，延续至东周、汉代。仰韶文化遗存最为丰富。1987年发现大规模古墓葬群。45号墓东西两侧各摆有蚌塑龙虎图案。该图案经测定距今约6500年。其中龙形是中国迄今所见最早、最大、最逼真的龙形象。2013年3月5日，该遗址被列为第七批全国重点文物保护单位。
archaeology: 1987年5月至11月，濮阳市文管会等单位获国家文物局批准，开展首次发掘。1988年3月11日至9月25日，进行大面积发掘。共布设探方90个、探沟30条。两年累计发掘面积超5000平方米。1988年清理房基4座、窖穴227个、陶窑5座、墓葬148座、瓮棺葬38座、东周排葬坑28个。遗址以仰韶文化堆积为主。另有少量龙山文化灰坑。仰韶文化遗迹包括房基、窖穴和墓葬。蚌塑动物图案共三组。第一组位于45号墓内，为龙与虎。第二组在45号墓南20米处，含龙、虎、鹿、蜘蛛等。第三组在第二组南约25米的灰沟中，含人骑龙、虎等形象。45号墓蚌塑龙虎图案距今约6500年。其龙形被专家称为「中华第一龙」。这批图案对研究龙的起源、美术史及黄河变迁具有重要价值。

figures:
  - name: 宇文恺
    role: 建筑学家、隋唐洛阳城规划设计者
    desc: 鲜卑族。字安乐。主持设计隋大兴城与隋唐洛阳城。著有《东都图记》20卷。
  - name: 杨达
    role: 隋代营建东都的负责人之一
    desc: 隋大业元年（605年）受命与宇文恺共同负责营建东都洛阳城。
  - name: 武则天
    role: 唐代皇帝，与洛阳城关系密切
    desc: 高宗与武则天长期居洛阳听政。天授元年（690年）定洛阳为国都。

  tips:
    - 虢国博物馆建在墓地遗址上。基本陈列《周风虢韵——虢国历史文化陈列》分为六个单元。
    - 可乘陇海线列车至三门峡站或三门峡南站。
    - 自驾可走连霍高速三门峡入口，或大运高速过三门峡黄河大桥。
    - 公交可选1路、6路、迎宾1号、18路等线路。

summary: 虢国墓地位于河南三门峡上村岭。年代为西周晚期至春秋早期，约公元前900年至公元前700年。它是虢国国君与贵族的集中埋葬地。出土大量青铜器和玉器。为周代考古提供关键断代标尺。
intro: 墓地位于三门峡市北上村岭。北距黄河岸边600米。南北长590米，东西宽550米。总面积约32.45万平方米。1956年首次发现。共发掘墓葬250多座。墓葬按身份由北向南分八组排列。第七、八组规格最高。埋葬国君与高级贵族。虢季墓M2001与虢仲墓M2009保存完整。出土玉柄铜芯铁剑、缀玉面罩、七璜联珠组玉佩等重要文物。
archaeology: 1956年，黄河水库考古工作队在夏鼐、安志敏率领下开展工作。林寿晋参与田野发掘。当年冬季发掘1052号太子墓，确认墓地位置。1957年起第一次大规模发掘。清理墓葬234座、车马坑3座、马坑1座。出土青铜器181件，含14件有铭铜器。陶器522件。其他遗物逾一万四千件。1990年至1999年第二次大规模发掘。姜涛担任领队。清理墓葬18座、车马坑4座、马坑2座。重点发掘虢季墓M2001与虢仲墓M2009。两墓出土青铜礼器、玉器、铁刃铜器等。虢仲墓出土青铜礼乐器120多件。鼎29件。含两套编钟，铭文最长60余字，自铭‘宝铃钟’。墓地出土玉器3500余件。多为新疆和阗玉。涵盖礼玉、仪仗玉、装饰玉、葬玉等类型。发掘成果推动丧葬制度、用玉制度、冶金史研究。虢季墓与虢仲墓分别入选1990年、1991年全国十大考古新发现。
events:
  - year: "1956"
    title: 发现墓地
    desc: 黄河水库考古工作队发掘1052号太子墓，确认虢国墓地所在。
  - year: 1990-1991
    title: 国君墓发掘
    desc: 河南省文物考古研究所与三门峡市文物工作队联合发掘虢季墓M2001与虢仲墓M2009。
  - year: "1996"
    title: 列入国保
    desc: 国务院公布虢国墓地为第四批全国重点文物保护单位。
  - year: "2021"
    title: 入选百大发现
    desc: 虢国墓地入选全国‘百年百大考古发现’。
artifacts:
  - name: 玉柄铜芯铁剑
    desc: 虢季墓M2001出土。有‘华夏第一剑’之称。是西周晚期人工冶铁与陨铁并用的重要实证。
    museum: ""
  - name: 缀玉面罩
    desc: 虢季墓M2001等国君墓出土。由多件玉片缀成。反映西周葬玉制度。
    museum: ""
  - name: 七璜联珠组玉佩
    desc: 虢季墓M2001出土。由七件玉璜与珠管串联而成。体现墓主身份等级。
    museum: ""
  - name: 铜内铁援戈
    desc: 虢仲墓M2009出土。铁刃铜器之一。经鉴定为陨铁制品。对冶金史研究有重要价值。
    museum: ""
  - name: 铜銎铁锛
    desc: 虢仲墓M2009出土。铁刃铜器之一。为人工冶铁制品。存世罕见。
    museum: ""
  - name: 龙纹玉璧
    desc: 虢仲墓M2009出土。和阗白玉制成。双面饰抽象变形云龙纹。工艺精绝。
    museum: ""
  - name: 玉遣册
    desc: 虢仲墓M2009出土。上有毛笔书写的‘南仲’字样。是中国现存最早的毛笔墨迹。
    museum: ""

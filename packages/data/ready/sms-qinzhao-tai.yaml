summary: 秦赵会盟台位于三门峡市渑池县。它是公元前279年秦昭襄王与赵惠文王渑池之会的纪念地。现存台体建于1985年。该遗址为省级文物保护单位。
intro: 秦赵会盟台在渑池县城西南一公里处。它坐落在渑水与羊河交汇形成的三角台地上。台体总高二十二米。下部是十四米高的梯形台基。上部是八米高的双层八角琉璃瓦亭。东西两侧各有五十二级台阶。台顶设有汉白玉围栏。中央立有四棱碑。碑上刻有舒同等书法家题词。还有《重修古秦赵会盟台碑记》。据《史记·廉颇蔺相如列传》记载，公元前279年两国君主在此会盟。蔺相如迫使秦王击缶，维护赵国尊严。双方掩埋兵器，堆土成台。这一事件称为‘渑池之会’。‘盟台夕照’是渑池八景之一。明代万历二十四年，知县王之都建亭于台上。清代嘉庆十三年，知县甘扬声重建碑亭。民国三十年，卫立煌与章士钊倡议重修。工程由郭昌锦主持，历时四年完成。该台在‘文化大革命’中被毁。仅存台顶碑塔。
archaeology: 现存台体是1985年渑池县人民政府在原存遗迹基础上修建的。1941年重修时，台顶竖立一座四棱锥形碑塔。塔高两米。每面宽三十八厘米。东面刻有寇遐所书‘古秦赵会盟台’六字。其余三面刻有章士钊《唐多令·景蔺》词。还刻有卫立煌、郭昌锦所撰重修记。‘文化大革命’中，护台基石与四面台阶全部被拆。仅存台顶碑塔。来源未提供考古发掘信息。也未说明发现时间、发现者或出土遗物。

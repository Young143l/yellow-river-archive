body: |-
  邙山陵墓群位于洛阳市北部。它涵盖东周至五代后唐六朝帝王陵共24座。2001年被列为第五批全国重点文物保护单位。
  该陵墓群分布于洛阳市北部、东部与东北部。地形属低山丘陵。海拔在120米至340米之间。土层深厚。黄土致密粘结。适宜营建墓葬。覆盖西工区、老城区、涧西区、瀍河区、洛龙区、偃师市、孟津县七个行政区。涉及二十多个乡镇。包含三百六十多个自然村。东西长约50千米。南北宽约20千米。总面积756平方千米。时间跨度自东周延续至五代后唐。已确认帝王陵24座。其中东周王墓8座。东汉帝陵5座。曹魏帝陵1座。西晋帝陵5座。北魏帝陵4座。后唐帝陵1座。陵墓群分为四段。西段为北魏陵区。中段含东周、东汉与后唐陵区。东段包括西晋和曹魏陵区。夹河段分布东汉与西晋墓群。陪葬墓超过一千座。当地素有‘生在苏杭，葬于北邙’之说。形成‘无卧牛之地’的密集格局。它是我国埋葬帝王数量最多、最集中的区域。被称为‘中国帝王谷’。也称‘东方金字塔’。已出土墓志六千余方。内容涵盖政治、经济、军事、文化、民族关系及中外交流。东汉帝陵封土由方形改为圆形。此形制影响后世帝陵建设。
  2002年5月，国家文物局批准开展邙山陵墓考古调查。2003年10月，第一阶段墓冢普查启动。普查历时近四年。2007年6月基本完成。工作初步厘清各时期陵墓分布特征。2006年7月，配合郑西高铁建设，发掘白草坡陵园遗址。这是首次揭露东汉帝陵陵园结构。2010年，连霍高速洛阳段改扩建中发现曹休墓。墓中后室出土‘曹休’铜印。前室出土一件鎏金铜带钩。1991年，社科院考古所与洛阳古墓博物馆联合发掘北魏宣武帝景陵。此次发掘确认了北魏帝陵基本形制。2004年2月至5月，对孝文帝长陵陵园开展全面勘察。确认陵园呈长方形。围墙外设壕沟。壕沟宽3米至4米。长陵封土高30米。封土直径100米。其布局承袭东汉皇陵规制。也体现孝文帝汉化改革特点。20世纪80年代，景陵经批准科学发掘。专家用残片复原青瓷盘口龙柄壶。陶砚也被复原。残石灯同样由残片拼合而成。2017年，东汉帝陵考古成果入选全国十大考古新发现。
  2001
  列入全国重点文保
  2001年6月25日，国务院公布其为第五批全国重点文物保护单位。
  2002
  考古调查立项
  2002年5月，国家文物局批准开展邙山陵墓考古调查与勘测。
  2006
  发掘白草坡陵园
  2006年7月起，结合郑西高铁工程，发掘东汉白草坡陵园遗址。
  2010
  发现曹休墓
  2010年，连霍高速洛阳段改扩建期间发现曹休墓。
  2021
  纳入大遗址规划
  2021年10月12日，入选国家文物局‘十四五’大遗址保护利用规划。
  “曹休”铜印
  边长约2厘米。瓦钮造型。印面阴刻篆书‘曹休’二字。是判定墓主身份的核心证据。

  鎏金铜带钩
  出自曹休墓前室。为判断墓葬年代与等级提供实物依据。

  青瓷盘口龙柄壶
  由北魏宣武帝景陵出土残片拼合复原而成。

  陶砚
  由北魏宣武帝景陵出土残片拼合复原而成。

  残石灯
  由北魏宣武帝景陵出土残片拼合复原而成。

  曹休
  曹魏将领
  2010年发现墓葬的主人。墓中出土‘曹休’铜印可确证身份。
  孝文帝
  北魏皇帝
  其长陵位于北魏陵区。2004年完成陵园全面勘察工作。
  宣武帝
  北魏皇帝
  其景陵位于今洛阳古代艺术博物馆西部。经发掘后对外开放。
  后唐明宗
  五代后唐皇帝
  其徽陵位于孟津县送庄乡护庄村西南。位置与文献记载一致。



  陵墓群跨七个区县，点位分散。建议包车游览多处遗址。
  北魏宣武帝景陵位于洛阳古代艺术博物馆内。可乘27路或83路抵达。
  该博物馆集中原址保护并展示25座典型古墓。

body: |-
  龙门石窟位于河南省洛阳市南郊。开凿始于北魏孝文帝迁都洛阳之时，即公元493年。现存窟龛共2345座。造像总数逾10万尊。2000年列入《世界遗产名录》。
  龙门石窟地处洛阳市南郊伊河两岸。地理坐标为东经112°27'54"、北纬34°33'24"。遗产区面积331公顷。缓冲区面积711公顷。伊河由南向北流经此处。河水切出龙门峡谷。西山崖壁属反向坡。稳定性较强。适合长期开凿。景区由四部分构成：西山石窟、东山石窟、香山寺、白园。西山集中了约九成造像。窟龛总数为2345座。造像数量超过10万尊。碑刻题记存有2800余块。分布长度约1公里。北魏开窟期为493至528年。代表洞窟有古阳洞、宾阳中洞、莲花洞。均位于西山。多属皇家营建。唐代开窟期为636至746年。该阶段造像占全窟三分之二。典型洞窟包括潜溪寺、宾阳南洞、奉先寺、万佛洞。奉先寺卢舍那大佛通高17米以上。头部高度约4米。耳长1.9米。石窟推动外来艺术中国化。是中国石窟艺术的重要里程碑。1961年成为首批全国重点文物保护单位。2000年11月入选《世界遗产名录》。
  2022年6月，科研人员在卢舍那大佛面部检出金、银元素。说明建造时可能使用贴金工艺。同在普贤菩萨造像眼部发现唐代琉璃眼珠。其主成分为二氧化硅与铅。呈弧形片状。厚度约为0.5厘米。右眼眼珠为整块琉璃。左眼眼珠由两块拼合。现仅存外侧一半。奉先寺保存如此规格的唐代琉璃实物极为稀少。2014年1月9日，考古队于西山红石沟北崖发现唐代景教瘗穴。上方刻有阴线十字架。确认为埋藏景教信徒骨灰的遗迹。这是国内首处确认的早期景教遗存。2024年3月20日，伊河龙门段出土一件菩萨造像残块。初步断代为唐代圆雕半身像。2024年4月10日，擂鼓台南洞加固施工中，清理前壁填充物时出土石刻造像与建筑构件80余件。这是首次在古代维修墙体内部发现此类遗存。2026年3月，西山南部六座塔区域保护作业时，在崖壁辨识出唐代石刻《金刚般若波罗蜜经》。
  493年
  北魏始凿
  北魏孝文帝迁都洛阳前后启动第一次大规模开窟造像。
  1961年
  列入国保
  国务院公布其为全国第一批重点文物保护单位。
  2000年
  列入世界遗产
  联合国教科文组织将其收入《世界遗产名录》。
  2014年
  发现景教瘗穴
  西山红石沟北崖发现唐代景教瘗穴。系国内首例。
  2022年
  发现琉璃眼珠
  普贤菩萨造像眼部检出唐代琉璃眼珠。卢舍那大佛面部测得金、银元素。
  古代琉璃眼珠
  出自普贤菩萨造像眼部。成分含二氧化硅与铅。是奉先寺罕见的唐代琉璃实物。
  龙门石窟研究院
  菩萨造像残块
  2024年伊河龙门段出土。初步判定为唐代圆雕菩萨半身像残件。

  石刻造像和建筑构件
  2024年擂鼓台南洞前壁填充物中出土80余件。属首次在古代维修墙体内部发现造像。

  大禹
  传说人物
  相传其治水时凿开龙门山。使伊水得以北流。《水经注》载‘昔大禹疏龙门以通水’。
  孝文帝
  北魏皇帝
  迁都洛阳之际启动龙门石窟首次大规模开窟造像。
  武则天
  唐皇帝
  卢舍那大佛据传依其容貌雕成。
  白居易
  唐代诗人
  晚年定居香山寺。与八位老人结成‘香山九老’。葬于香山寺如满大师塔旁。
  赠崔侍御
  李白
  唐
  黄河三尺鲤，本在孟津居，点额不成龙，归来伴凡鱼。
  诗中‘孟津’即今洛阳下辖县。印证‘鱼跃龙门’传说发生于此。

  实行一票制。覆盖西山石窟、东山石窟、香山寺、白园。全价90元/人。半价45元/人。

  推荐游览顺序为西山石窟—东山石窟—香山寺—白园。
  西山石窟汇集约九成造像。是景区核心区域。
  自2025年4月1日起。全面启用线上与线下实名购票制度。
  景区推出夜游项目。含‘诗乐伊渡·伊水禅意游’等主题线路。
